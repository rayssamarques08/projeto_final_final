<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Aluno</title>
    <link rel="stylesheet" href="cadastro.css">
</head>

<body>
    <main>

        <h1>CADASTRO ALUNO</h1>
        <form>
            <div class="inputGroup"> <label for="name">Nome:</label>
                <div class="input-item"><i class="fa-solid fa-user-graduate"></i>
                    <input id="name" type="text">
                </div>
            </div>
            <div class="inputGroup"><label for="phone">Turma: </label>
                <div class="input-item"><i class="fa-solid fa-chalkboard-user"></i> <input id="phone" type="text" />
                </div>
            </div>
            <div class="inputGroup"> <label for="email">Sobre o Aluno:</label>
                <div class="input-item"><i class="fa-solid fa-circle-info"></i>
                    <input id="email" type="text">
                </div>
            </div>
            <div class="inputGroup"> <label for="cpf">Atuação:</label>
                <div class="input-item"><i class="fa-solid fa-folder"></i>
                    <input id="cpf" type="text">
                </div>
            </div>
            <div class="inputGroup"> <label for="cpf">Tecnologias:</label>
                <div class="input-item"><i class="fa-solid fa-folder"></i>
                    <input id="cpf" type="text">
                </div>
            </div>
            <div class="inputGroup"> <label for="cpf">Habilidades:</label>
                <div class="input-item"><i class="fa-solid fa-folder"></i>
                    <input id="cpf" type="text">
                </div>
            </div>
            <div class="inputGroup"> <label for="cpf">Ferramentas:</label>
                <div class="input-item"><i class="fa-solid fa-folder"></i>
                    <input id="cpf" type="text">
                </div>
            </div>

            <button class="btn-cadastrocliente"><a href="listagem_aluno.html">CADASTRE</a></button>
        </form>

    </main>
</body>

</html>
