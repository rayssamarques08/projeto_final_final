<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Turma</title>
    <link rel="stylesheet" href="cadastro.css">
</head>
<body>
      <main>

        <h1>CADASTRO TURMA</h1>
        <form>
            <div class="inputGroup"> <label for="name">Nome:</label>
                <div class="input-item"><i class="fa-solid fa-user"></i>
                    <input id="name" type="text">
                </div>
            </div>
            <div class="inputGroup"><label for="phone">Período : </label>
                <div class="input-item"><i class="fa-solid fa-phone"></i> <input id="phone" type="text" />
                </div>
            </div>
            <div class="inputGroup"> <label for="email">Professor:</label>
                <div class="input-item"><i class="fa-regular fa-envelope"></i>
                    <input id="email" type="text">
                </div>
            </div>
            


            <button class="btn-cadastrocliente"><a href="listagem_turma.html">CADASTRE</a></button>
        </form>

    </main>
</body>
</html>
